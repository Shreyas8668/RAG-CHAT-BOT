services:
  - type: web
    name: rag-chat-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt && npm install && npm run build"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "20"
